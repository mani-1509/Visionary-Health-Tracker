{% extends "base.html" %}

{% block extra_head %}
<style>
  .auth-page-wrapper {
    min-height: 75vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 0;
  }

  .auth-card {
    width: 100%;
    max-width: 440px;
    padding: 44px 36px;
    text-align: center;
    background: linear-gradient(135deg, rgba(26, 16, 63, 0.75), rgba(15, 10, 33, 0.9));
  }

  .auth-header {
    margin-bottom: 30px;
  }

  .auth-header h1 {
    font-size: 2rem;
    margin-bottom: 6px;
  }

  .auth-header p {
    color: var(--text-muted);
    font-size: 0.92rem;
  }

  .auth-form {
    display: flex;
    flex-direction: column;
    gap: 20px;
    text-align: left;
  }

  .form-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .form-field label {
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--text-secondary);
  }

  .auth-input {
    width: 100%;
    padding: 12px 18px;
    background: rgba(11, 7, 24, 0.6);
    border: 1px solid var(--border-glass);
    border-radius: var(--radius-full);
    color: #ffffff;
    font-family: var(--font-body);
    font-size: 0.98rem;
    transition: var(--transition-fast);
  }

  .auth-input:focus {
    outline: none;
    border-color: var(--accent-light);
    box-shadow: 0 0 12px var(--accent-glow);
  }

  .auth-footer-text {
    margin-top: 10px;
    font-size: 0.9rem;
    color: var(--text-muted);
    text-align: center;
  }

  .auth-footer-text a {
    color: var(--accent-light);
    font-weight: 600;
  }

  .error-alert {
    background: rgba(239, 68, 68, 0.12);
    border: 1px solid rgba(239, 68, 68, 0.35);
    color: #fca5a5;
    padding: 12px;
    border-radius: var(--radius-md);
    font-size: 0.9rem;
    text-align: center;
    margin-top: 15px;
  }
</style>
{% endblock %}

{% block content %}
<div class="auth-page-wrapper">
  <div class="auth-card glass-card">
    <div class="auth-header">
      <h1>Welcome Back</h1>
      <p>Log in to access your health telemetry dashboard</p>
    </div>

    <form method="POST" action="/login" class="auth-form">
      <div class="form-field">
        <label for="username">Username</label>
        <input
          class="auth-input"
          type="text"
          id="username"
          name="username"
          placeholder="Enter your username"
          required
        />
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <input
          class="auth-input"
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          required
        />
      </div>

      <button class="btn-primary" type="submit" style="width: 100%; margin-top: 10px;">Log In</button>
      
      <p class="auth-footer-text">
        Don't have an account? <a href="/register">Register here</a>
      </p>
    </form>

    {% if error %}
    <div class="error-alert">{{ error }}</div>
    {% endif %}
  </div>
</div>
{% endblock %}
